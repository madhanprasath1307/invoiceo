name: invoiceo
description: "Invoice generating desktop app built with Flutter"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.7+8
environment:
  sdk: '>=3.3.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  intl: ^0.20.2
  pdf: ^3.11.3
  printing: ^5.11.0
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.6
  sqlite3: ^2.9.4 # Linux: open libsqlite3.so.0 when the -dev symlink is missing (main.dart)
  path: ^1.8.3
  path_provider: ^2.0.15
  shared_preferences: ^2.3.2
  file_picker: ^10.2.0
  macos_secure_bookmarks: ^0.3.0 # macOS: keep access to the automatic backup folder after a restart
  permission_handler: ^12.0.1
  share_plus: ^11.0.0
  crypto: ^3.0.3
  cryptography: ^2.7.0
  uuid: ^4.0.0
  csv: ^6.0.0
  archive: ^4.0.0
  flutter_riverpod: ^2.5.1
  open_file: ^3.3.2
  url_launcher: ^6.2.6
  http: ^1.2.0
  fuzzywuzzy: ^1.2.0
  fl_chart: ^0.69.0
  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.6
  window_manager: ^0.5.1
  screen_retriever: ^0.2.0
  flutter_svg: ^2.0.10+1
  image: ^4.2.0
  qr: ^3.0.1
  flex_color_picker: ^3.6.0
  thermal_printer: ^1.0.5
  flutter_esc_pos_utils: ^1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  package_rename: ^1.10.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  generate: true
  assets:
   - assets/images/logo.png
   - assets/images/logo_dark.png
   - assets/images/logo_compact.png
   - assets/images/logo_compact_dark.png
   - assets/images/bmc_logo.svg
   - assets/images/logo_v.png
   - assets/images/logo_v_dark.png
   - assets/images/grid_classic_additional_fields.png
   - assets/data/settings.json
   - assets/data/faq.json
   - assets/fonts/
   - LICENSE
  fonts:
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
        - asset: assets/fonts/NotoSansDevanagari-Bold.ttf
          weight: 700
    - family: NotoSerifTibetan
      fonts:
        - asset: assets/fonts/NotoSerifTibetan-Regular.ttf
        - asset: assets/fonts/NotoSerifTibetan-Bold.ttf
          weight: 700
    - family: NotoSansTamil
      fonts:
        - asset: assets/fonts/NotoSansTamil-Regular.ttf
        - asset: assets/fonts/NotoSansTamil-Bold.ttf
          weight: 700
    - family: Cookie
      fonts:
        - asset: assets/fonts/Cookie-Regular.ttf

flutter_launcher_icons:
  macos:
    generate: true
    image_path: "assets/images/logo_v.png"

package_rename_config:
  linux:
    app_name: invoiceo
    package_name: com.invoiceo.app
    exe_name: invoiceo

  windows:
    app_name: invoiceo
    organization: Invoiceo
    copyright_notice: Copyright © 2026 Invoiceo. All rights reserved.
    exe_name: invoiceo

  web:
    app_name: invoiceo
    short_app_name: invoiceo
    description: Invoice generating desktop app built with Flutter
